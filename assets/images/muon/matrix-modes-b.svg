<title>State B: Muon updates three independent quadratic modes</title>
<desc>Before coordinates [0.1, 1.1, 1.2]; subtracting one gives [-0.9, 0.1, 0.2]. Each mode has loss one half its coordinate squared. The next update points toward zero in each mode, yielding cosine +1/3.</desc>
