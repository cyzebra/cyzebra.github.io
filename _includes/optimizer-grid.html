<figure id="fig-optimizer-memory" class="research-figure optimizer-comparison"><div class="figure-heading"><p class="eyebrow">130M · Optimizer memory</p><h3>Positive alignment with momentum and AdamW</h3></div><div class="panel-key"><span><i class="key-blue"></i>Muon · no momentum</span><span><i class="key-teal"></i>Muon · momentum 0.95</span><span><i class="key-gold"></i>AdamW</span></div><div class="figure-grid figure-grid-two"><div><h4>Global alignment through training</h4><a class="figure-link" href="{{ '/assets/images/muon/optimizer-global.svg' | relative_url }}"><img src="{{ '/assets/images/muon/optimizer-global.svg' | relative_url }}" alt="130M consecutive-update cosines: weakly negative without momentum, persistently positive with momentum 0.95 and AdamW." loading="lazy" decoding="async"></a></div><div><h4>The positive sign persists across layers</h4><a class="figure-link" href="{{ '/assets/images/muon/optimizer-layers.svg' | relative_url }}"><img src="{{ '/assets/images/muon/optimizer-layers.svg' | relative_url }}" alt="All twelve layers have positive mean alignment in the momentum-Muon and AdamW runs. Bars show temporal fifth-to-ninety-fifth percentile ranges." loading="lazy" decoding="async"></a></div></div><figcaption><p><strong>Figure 8 · Optimizer memory accompanies persistent positive alignment.</strong> The additional 130M runs use Muon with momentum 0.95 and Nesterov updates, or AdamW with β₁ = 0.9 and β₂ = 0.95. Every recorded global, layer-level and individual matrix-level cosine is positive in both runs. The right panel summarizes the common window from updates 500 to 36,827: dots are means and bars are temporal 5–95% ranges, not confidence intervals. The AdamW trajectory ends at its available snapshot.</p></figcaption></figure>
