<figcaption><p><strong>Figure 3 · Muon changes relative strengths, not just the overall scale.</strong> An exact full-rank 2×2 example with singular values 4 and 1. Colored arrows are outputs of fixed input singular vectors. Global Frobenius normalization preserves the 4:1 ratio; exact polar normalization removes it. The slider illustrates this transformation by interpolating singular values; it is not Newton–Schulz iteration. NS-5 approximates the polar target.</p></figcaption></figure>
